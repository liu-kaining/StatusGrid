name: Collect and maintain status
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync collects; retry republishes persisted state; diagnostic is read-only'
        type: choice
        options: [sync, retry, diagnostic]
        default: sync
      providers:
        description: 'Diagnostic provider ID(s), comma separated'
        type: string
        default: github
permissions:
  contents: read
concurrency:
  group: statusgrid-release
  cancel-in-progress: false
  queue: max
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read-only source diagnostic
        env:
          PROVIDERS: ${{ inputs.providers }}
        run: npm run collect -- --providers "$PROVIDERS" --interval 5 --report "$RUNNER_TEMP/diagnostic.json"
      - if: failure()
        run: echo 'Read-only diagnostic failed; no state or site was published.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: github.event_name == 'schedule' || inputs.mode != 'diagnostic'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      mode: ${{ inputs.mode || 'sync' }}
