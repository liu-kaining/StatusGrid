name: Collect and maintain status
on:
  schedule:
    - cron: '2-59/5 * * * *'
    # Set repository variable STATUSGRID_INTERVAL_MINUTES=10 to choose this schedule.
    - cron: '2-59/10 * * * *'
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'sync collects; retry republishes persisted state; diagnostic is read-only'
        type: choice
        options: [sync, retry, diagnostic, backup]
        default: sync
      providers:
        description: 'Diagnostic provider ID(s), comma separated'
        type: string
        default: github
      interval:
        description: 'Target collection interval in minutes'
        type: choice
        options: ['5', '10']
        default: '5'
permissions:
  contents: read
concurrency:
  group: statusgrid-release
  cancel-in-progress: false
  queue: max
jobs:
  diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Read-only source diagnostic
        env:
          PROVIDERS: ${{ inputs.providers }}
          INTERVAL: ${{ inputs.interval }}
        run: npm run collect -- --providers "$PROVIDERS" --interval "$INTERVAL" --report "$RUNNER_TEMP/diagnostic.json"
      - if: failure()
        run: echo 'Read-only diagnostic failed; no state or site was published.' >> "$GITHUB_STEP_SUMMARY"
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'diagnostic') ||
      (github.event.schedule == '17 0 * * *') ||
      (github.event.schedule == '2-59/5 * * * *' && vars.STATUSGRID_INTERVAL_MINUTES != '10') ||
      (github.event.schedule == '2-59/10 * * * *' && vars.STATUSGRID_INTERVAL_MINUTES == '10')
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      mode: ${{ github.event.schedule == '17 0 * * *' && 'backup' || inputs.mode || 'sync' }}
      interval: ${{ inputs.interval || vars.STATUSGRID_INTERVAL_MINUTES || '5' }}
