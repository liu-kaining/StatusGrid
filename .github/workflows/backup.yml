name: Back up collected status
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: statusgrid-release
  cancel-in-progress: false
  queue: max
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - id: backup
        env:
          RELEASE_MODE: backup
        run: npx tsx scripts/workflow-release.ts run
      - name: Daily validated state backup (30 days)
        if: steps.backup.outputs.status == 'backed-up'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: statusgrid-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.backup.outputs.backup }}
          if-no-files-found: error
          retention-days: 30
      - if: failure()
        run: echo 'Daily state backup failed. Existing state was not modified.' >> "$GITHUB_STEP_SUMMARY"
