name: Publish complete Pages release
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
      source-sha:
        type: string
        default: main
      fingerprint:
        type: string
        default: ''
# The entry workflow owns statusgrid-release for the entire call; do not reacquire it here.
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - if: inputs.mode == 'sync'
        run: npx playwright install --with-deps chromium
      - if: inputs.mode == 'frontend'
        run: npm run build
      - name: Stage, validate, then update durable snapshots with CAS
        id: release
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          SOURCE_SHA: ${{ github.sha }}
          SHELL_DIR: ${{ inputs.mode == 'frontend' && 'dist' || '' }}
          FRONTEND_FINGERPRINT: ${{ inputs.fingerprint }}
        run: npx tsx scripts/workflow-release.ts run
      - if: steps.release.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload complete validated site
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.release.outputs.site }}
          include-hidden-files: true
      - name: Explicit Pages deployment
        id: deployment
        if: steps.release.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      - name: Verify deployed shell and current live snapshot
        if: steps.release.outputs.publish == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SITE: ${{ steps.release.outputs.site }}
        run: npx tsx scripts/verify-deployment.ts
      - name: Failure and recovery summary
        if: failure()
        run: |
          echo 'Release failed. data and gh-pages use independent CAS writes; valid data may already be durable.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run sync manually with mode=retry to reuse the durable shell/state without collecting or reissuing ledger entries. A missing shell requires Frontend release first.' >> "$GITHUB_STEP_SUMMARY"
